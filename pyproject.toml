[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemo-protocol"
version = "3.1.0"
description = "Python SDK for the Mnemo watermarking API"
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=7.4", "requests-mock>=1.11"]

[project.urls]
Repository = "https://github.com/MnemoProtocol/mnemo-sdk"

[tool.hatch.build.targets.wheel]
packages = ["mnemo_sdk"]
